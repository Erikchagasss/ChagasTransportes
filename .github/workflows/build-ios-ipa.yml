name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and sync Capacitor
        run: |
          npm ci
          npm run cap:sync

      - name: Build unsigned iOS app
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Release
          -sdk iphoneos
          -derivedDataPath "$RUNNER_TEMP/ios-build"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package IPA for free-account sideloading
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$RUNNER_TEMP/ios-build/Build/Products/Release-iphoneos/App.app" \
            "$RUNNER_TEMP/ipa/Payload/ChagasTransporte.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$RUNNER_TEMP/ChagasTransporte.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChagasTransporte-IPA
          path: ${{ runner.temp }}/ChagasTransporte.ipa
          if-no-files-found: error
          retention-days: 1
